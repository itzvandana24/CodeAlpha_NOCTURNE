    <main class="container my-3">
      <!-- Hero Section -->
      <section class="row">
        <div class="col-12">
          <div class="gallery-hero-section mb-3">
            <div>
              <p class="mb-2">THE COLLECTION</p>
              <h1 class="mb-3">Nature,<br />through another lens.</h1>
              <p>
                A curated collection of moments, places and people after sunset.
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- Filter Section -->
      <section class="gallery-filter-section row align-items-center">
        <div class="col-lg-9 col-md-8">
          <button
            class="filter-toggle mb-3"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#categoryOptions"
            aria-expanded="false"
            aria-controls="categoryOptions"
          >
            <i class="fa-solid fa-sliders"></i>
            EXPLORE GALLERY
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <!-- Adding coolapse feature -->
          <div class="collapse category-collapse" id="categoryOptions">
            <div class="category-filters mb-3">
              <button class="filter-btn all-btn active" data-filter="all">
                ALL
              </button>
              <button class="filter-btn city-btn" data-filter="city">
                CITY
              </button>
              <button class="filter-btn forest-btn" data-filter="forest">
                FOREST
              </button>
              <button class="filter-btn water-btn" data-filter="water">
                WATER
              </button>
              <button class="filter-btn night-btn" data-filter="night">
                NIGHT
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Pagination Section -->

              id="prev-btn"
              type="button"
            >
              <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="page-numbers" id="page-numbers">
              <button class="page-btn active" data-page="1">1</button>
              <button class="page-btn" data-page="2">2</button>
              <button class="page-btn" data-page="3">3</button>
              <button class="page-btn" data-page="4">4</button>

            >

    <!-- Lightbox Creation -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <!-- Close Button -->
      <button
        type="button"
        class="lightbox-close"
        id="lightboxClose"
        aria-label="Close image viewer"
      >
        &times;
      </button>

      <!-- Preview Button -->
      <button
        type="button"
        class="lightbox-prev"
        id="lightboxPrev"
        aria-label="Previous image"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <!-- Enlarged Image -->
      <div class="lightbox-content">
        <img src="" alt="" id="lightboxImage" />
        <!-- Image Counter -->
        <p class="lightbox-counter" id="lightboxCounter"></p>
      </div>

      <!-- Next Button -->
      <button
        class="lightbox-next"
        id="lightboxNext"
        type="button"
        aria-label="Next image"
      >
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
